  # connection). Sources: sacctmgr assoc/qos, scontrol show
  # partition/node, sbatch --test-only, module spider + live module load,
  # ls/df on scratch.
  # Fields set by the authors stay REQUIRED.
  verified_cluster: granite1.chpc.utah.edu   # primary target
                                  # (chosen 2026-09-02);
                                  # notchpeak/kingspeak facts verified
                                  # earlier remain in git history
  account: sparks                 # granite QoS list includes sparks-gpu-grn
                                  # (sacctmgr assoc, verified live)
  partition: sparks-gpu-grn       # group-owned; contains exactly one node
  qos: sparks-gpu-grn             # MaxWall 14-00:00:00
  node: grn061                    # 64 cores (1 socket, 2 threads/core),
                                  # 380 GB RAM, 1x H100 NVL GPU,
                                  # TmpDisk 7.2T, DefMemPerCPU=2000M
  partition_notes: >
    Single-node partition: the pilot's 2- and 4-node jobs are recast as
    wider single-node jobs (16 MPI tasks per former node, max 64).
    PreemptMode=CANCEL verified live: sbatch --test-only showed
    sparks-gpu-grn jobs would PREEMPT (cancel) two running
