# Case-study manifest — Section 20.2 of qe_privacy_tax_multi_agent_experiment.md
# Rule (§20.2): missing values remain REQUIRED and must not be silently
# replaced by defaults. Fields marked REQUIRED are set by the authors or must
# be verified live (e.g. on CHPC) before being filled and frozen.
#
# FROZEN 2026-09-02 for prior_predictive_simulation mode, from the
# parameters set in the study design. Live-mode CHPC fields remain REQUIRED
# and no live job may be submitted until they are verified on the cluster
# and frozen here.

case_id: mpt-chpc-qe-mx2-001
mode: prior_predictive_simulation_plus_live_dft   # extended 2026-09-08
    # from pilot-only to an actual DFT campaign: live QE fidelity-ladder
    # campaign on the 30 CC0 candidates on granite sparks-gpu-grn
    # (dft_campaign/), node time limit 20160 minutes for the entire run.
    # Simulated node-hours in the prior-predictive analyses remain
    # simulated units.
frozen_for_mode: prior_predictive_simulation
frozen_date: "2026-09-02"
choices_are_provisional: true       # per the study design

scientific_task:
  discovery_question: >
    Identify nondominated 2D MX2 monolayer candidates with a relaxed,
    numerically valid structure, a PBE-level screening gap of 1.0-2.0 eV,
    no obvious Gamma-point phonon instability among finalists, and low
    computational cost.
  candidate_source_and_license: >
    Locally generated idealized 1T and 2H MX2 prototypes (no external
    structure database). Generated structures and metadata released under
    CC0-1.0. Pseudopotentials retain their original licenses and are
    listed separately (none are bundled in this repository).
  candidate_count: 30
  candidate_space:
    metals: [Ti, Zr, Hf, Mo, W]
    chalcogens: [S, Se, Te]
    phases: ["1T", "2H"]
  target_outcome_vector:
    - relaxation_converged
    - scf_converged
    - final_maximum_force
    - phase_energy_difference_within_composition
    - pbe_band_gap_ev
    - soc_band_gap_ev_for_finalists
    - gamma_phonon_result_for_finalists
    - scientific_uncertainty
    - qe_calls
    - node_hours
    - wall_time
    - peak_memory
    - failure_count
    - restart_count
  validity_constraints:
    - Gamma-point phonons are not proof of full dynamical stability.
    - PBE gaps are screening quantities, not experimental predictions.
    - Total energies must not be ranked directly across compositions.
    - Pseudopotentials retain their original licenses.
    - No gain may depend solely on relaxing validity requirements.
  fidelity_ladder:
    F0: Input, structure, pseudopotential, and resource validation.
    F1: Coarse SCF or short relaxation for early rejection.
    F2: Converged structural relaxation followed by production SCF.
    F3: NSCF and band calculation; add SOC for promoted candidates.
    F4: Gamma-point phonon check for selected finalists.
  reference_and_validation_calculations: >
    Prior-predictive mode: evaluator-only latent world ground truth plays
    the reference role. For any future live pilot, reference/validation
    calculations must be defined and frozen before submission (REQUIRED).

quantum_espresso:
  # Simulated-units mode: no QE binary is executed. All fields below are
  # abstracted in the digital twin and MUST be verified before live mode.
  verified_version_and_build: REQUIRED_FOR_LIVE_MODE
  executable_workflow: REQUIRED_FOR_LIVE_MODE   # pw.x / ph.x via SLURM
  functional_and_physics_options: PBE_screening_abstracted_in_twin
  pseudopotential_manifest_with_hashes: REQUIRED_FOR_LIVE_MODE
  convergence_protocol: abstracted_in_twin_frozen_in_code
  input_output_schema: see_prior_predictive/simulator.py

